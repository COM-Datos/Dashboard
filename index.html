<style>
:root{
  --bg:#F7F6F3;
  --surface:#FFFFFF;
  --border:#E2DED6;
  --border2:#D0CBCB;
  --text:#1A1714;
  --text2:#6B6560;
  --text3:#9E9890;
  --blue:#346A92;   --blue-bg:#EAF3F8;   --blue-border:#C7DDE9;
  --teal:#39745E;   --teal-bg:#E9F4EE;   --teal-border:#C8E1D4;
  --amber:#9A642A;  --amber-bg:#FBF0E2;  --amber-border:#EBCFAA;
  --violet:#6C5790; --violet-bg:#F0ECF6; --violet-border:#D8CCE8;
  --shadow:0 4px 20px rgba(26,23,20,.06),0 1px 3px rgba(26,23,20,.05);
  --shadow-hover:0 12px 32px rgba(26,23,20,.10),0 2px 6px rgba(26,23,20,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'DM Sans',system-ui,sans-serif;color:var(--text);min-height:100vh;
  display:flex;
  background:
    radial-gradient(circle at 15% 8%, #EDEEF9 0%, transparent 45%),
    radial-gradient(circle at 88% 92%, #E7F3EE 0%, transparent 45%),
    var(--bg);
  padding:clamp(2rem,5vh,4rem) 1.5rem;
}
.cover{max-width:860px;width:100%;text-align:center;margin:auto;transform:translateY(-4.1rem)}

.headline{font-size:clamp(34px,6vw,52px);font-weight:700;letter-spacing:-1.3px;color:var(--text);line-height:1.08;text-wrap:balance}
.rule{width:42px;height:3px;border-radius:2px;background:var(--teal);margin:1.5rem auto 3rem}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:680px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
@media (max-height:680px){.cover{transform:none}}

.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:2rem 1rem 1.6rem;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.tile.active{cursor:pointer}
.tile.active:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover);border-color:var(--border2)}
.tile.disabled{cursor:default;box-shadow:none;background:#FBFAF8}
.tile.disabled .tile-icon{filter:grayscale(1);opacity:.45}
.tile.disabled .tile-name{color:var(--text3)}

.tile-icon{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.tile-icon svg{width:26px;height:26px;fill:none;stroke-width:1.6}
.tile-name{font-size:14.5px;font-weight:600;letter-spacing:-.1px}
.tile-tag{position:absolute;top:10px;right:10px;font-family:'DM Mono',monospace;font-size:8.5px;font-weight:500;letter-spacing:.4px;text-transform:uppercase;color:var(--text3);background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:2px 8px}

.acc-blue .tile-icon{background:#DDECF4}.acc-blue .tile-icon svg{stroke:var(--blue)}
.acc-teal .tile-icon{background:#DCEDE4}.acc-teal .tile-icon svg{stroke:var(--teal)}
.acc-amber .tile-icon{background:#F5E4CF}.acc-amber .tile-icon svg{stroke:var(--amber)}
.acc-violet .tile-icon{background:#E5DDF0}.acc-violet .tile-icon svg{stroke:var(--violet)}

.foot{margin-top:3rem;font-family:'DM Mono',monospace;font-size:10.5px;color:var(--text3);letter-spacing:.3px}
</style>
</head>
