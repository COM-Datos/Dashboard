<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Centro Operativo — Datos</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F6F3;
  --surface:#FFFFFF;
  --border:#E2DED6;
  --border2:#D0CBCB;
  --text:#1A1714;
  --text2:#6B6560;
  --text3:#9E9890;
  --blue:#185FA5;   --blue-bg:#E6F1FB;   --blue-border:#B5D4F4;
  --teal:#0F6E56;   --teal-bg:#E1F5EE;   --teal-border:#9FE1CB;
  --amber:#854F0B;  --amber-bg:#FAEEDA;  --amber-border:#FAC775;
  --red:#A32D2D;    --red-bg:#FCEBEB;    --red-border:#F7C1C1;
  --violet:#5B3EA6; --violet-bg:#EEE9FB; --violet-border:#CBB9F0;
  --shadow:0 4px 20px rgba(26,23,20,.06),0 1px 3px rgba(26,23,20,.05);
  --shadow-hover:0 12px 32px rgba(26,23,20,.10),0 2px 6px rgba(26,23,20,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'DM Sans',system-ui,sans-serif;color:var(--text);min-height:100vh;
  background:
    radial-gradient(circle at 15% 8%, #EDEEF9 0%, transparent 45%),
    radial-gradient(circle at 88% 92%, #E7F3EE 0%, transparent 45%),
    var(--bg);
  display:flex;align-items:center;justify-content:center;padding:3rem 1.5rem;
}
.cover{max-width:860px;width:100%;text-align:center}

.eyebrow{font-family:'DM Mono',monospace;font-size:11.5px;font-weight:500;letter-spacing:2.2px;text-transform:uppercase;color:var(--text3);margin-bottom:.9rem}
.headline{font-size:clamp(34px,6vw,52px);font-weight:700;letter-spacing:-1.3px;color:var(--text);line-height:1.05}
.rule{width:36px;height:3px;border-radius:2px;background:var(--blue);margin:1.4rem auto 3rem}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:680px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:420px){.grid{grid-template-columns:1fr}}

.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:2rem 1rem 1.6rem;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.tile.active{cursor:pointer}
.tile.active:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover);border-color:var(--border2)}
.tile.disabled{cursor:default;box-shadow:none;background:#FBFAF8}
.tile.disabled .tile-icon{filter:grayscale(1);opacity:.45}
.tile.disabled .tile-name{color:var(--text3)}

.tile-icon{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.tile-icon svg{width:26px;height:26px;fill:none;stroke-width:1.6}
.tile-name{font-size:14.5px;font-weight:600;letter-spacing:-.1px}
.tile-tag{position:absolute;top:10px;right:10px;font-family:'DM Mono',monospace;font-size:8.5px;font-weight:500;letter-spacing:.4px;text-transform:uppercase;color:var(--text3);background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:2px 8px}

.acc-blue .tile-icon{background:var(--blue-bg)}.acc-blue .tile-icon svg{stroke:var(--blue)}
.acc-teal .tile-icon{background:var(--teal-bg)}.acc-teal .tile-icon svg{stroke:var(--teal)}
.acc-amber .tile-icon{background:var(--amber-bg)}.acc-amber .tile-icon svg{stroke:var(--amber)}
.acc-red .tile-icon{background:var(--red-bg)}.acc-red .tile-icon svg{stroke:var(--red)}
.acc-violet .tile-icon{background:var(--violet-bg)}.acc-violet .tile-icon svg{stroke:var(--violet)}

.foot{margin-top:3rem;font-family:'DM Mono',monospace;font-size:10.5px;color:var(--text3);letter-spacing:.3px}
</style>
</head>
<body>
<div class="cover">

  <div class="eyebrow">Centro Operativo de Montevideo</div>
  <div class="headline">Datos</div>
  <div class="rule"></div>

  <div class="grid">

    <a class="tile active acc-blue" href="dashboard_reclamos_com.html">
      <div class="tile-icon">
        <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>
      </div>
      <div class="tile-name">Reclamos</div>
    </a>

    <a class="tile active acc-teal" href="Transportistas.html">
      <div class="tile-icon">
        <svg viewBox="0 0 24 24"><rect x="1" y="7" width="14" height="10" rx="1"/><path d="M15 10h4l3 3v4h-7z"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="19" r="2"/></svg>
      </div>
      <div class="tile-name">Transportistas</div>
    </a>

    <a class="tile active acc-teal" href="Zona%20Limpia.html">
      <div class="tile-icon">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
      </div>
      <div class="tile-name">Zona Limpia</div>
    </a>

    <div class="tile disabled acc-violet">
      <span class="tile-tag">Próximamente</span>
      <div class="tile-icon">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      </div>
      <div class="tile-name">Agenda</div>
    </div>

    <div class="tile disabled acc-amber">
      <span class="tile-tag">Próximamente</span>
      <div class="tile-icon">
        <svg viewBox="0 0 24 24"><path d="M6 8h12l1.5 12.5a2 2 0 0 1-2 2.5H6.5a2 2 0 0 1-2-2.5z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
      </div>
      <div class="tile-name">Bolsones</div>
    </div>

    <div class="tile disabled acc-red">
      <span class="tile-tag">Próximamente</span>
      <div class="tile-icon">
        <svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0-1.4l-1.6-1.6a1 1 0 0 0-1.4 0L3 12v3h3zM9 6l3 3"/><path d="M3 21l6-1 9-9-5-5-9 9z"/></svg>
      </div>
      <div class="tile-name">Tareas Especiales</div>
    </div>

  </div>

  <div class="foot">Actualizado a día vencido</div>

</div>
</body>
</html>
