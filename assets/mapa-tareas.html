<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de Tareas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel-2:#f1f3f6; --text:#18202b; --muted:#5d6877; --line:#e3e7ec;
  --accent:#1f6feb; --accent-soft:#e6efff; --shadow:0 8px 30px rgba(20,30,50,.12);
}
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:280px 1fr;height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;position:relative;z-index:2;overflow:hidden}
#map{height:100%;background:var(--bg)}
.filters{display:flex;flex:1;flex-direction:column;justify-content:space-between;gap:16px;padding:16px 14px;overflow:auto}
.filter-group{flex:none;min-width:0}
.flabel{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 7px;font-weight:600;display:flex;justify-content:space-between}
.seg{display:flex;background:var(--panel-2);border-radius:9px;padding:3px}
.seg button{flex:1;border:0;background:none;color:var(--muted);padding:6px 4px;border-radius:7px;font:inherit;font-size:12.5px;font-weight:500;cursor:pointer}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:4px 9px;font:inherit;font-size:12.5px;line-height:1.35;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip .dot{width:9px;height:9px;border-radius:50%}
.days{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.days .chip{justify-content:center;padding:5px 0}
#fMun{flex-wrap:nowrap;gap:3px}
#fMun .chip{flex:1;min-width:0;justify-content:center;padding:4px 5px;font-size:12px}
:root:fullscreen .filters{justify-content:flex-start;gap:20px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
/* etiqueta de tarea */
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;color:#fff}
.dtitle{font-size:15px;font-weight:700;margin:0 22px 0 0;padding-bottom:10px;border-bottom:1px solid var(--line);white-space:pre-line;letter-spacing:-.01em}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;margin:10px 0 0;align-items:baseline}
.meta dt{color:var(--muted)}
.meta dd{margin:0;white-space:pre-line}
.week{display:flex;gap:3px}
.week span{flex:1;text-align:center;font-size:11px;padding:4px 0;border-radius:6px;background:var(--panel-2);color:var(--muted)}
.week span.on{background:var(--accent);color:#fff;font-weight:600}
.card{position:absolute;left:12px;bottom:28px;z-index:600;width:290px;max-width:calc(100% - 24px);background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px 16px;font-size:13px}
.card[hidden]{display:none}
.card .x{all:unset;position:absolute;top:8px;right:10px;cursor:pointer;color:var(--muted);font-size:20px;line-height:1}
.card .x:hover{color:var(--text)}
/* mapa */
.leaflet-container path.leaflet-interactive:focus,.leaflet-container .leaflet-marker-icon:focus{outline:none}
.leaflet-container{font:inherit;background:var(--bg)}
.mk{width:24px;height:24px;border-radius:50%;border:2px solid #fff;color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.35);transition:opacity .15s}
.mk.dim{opacity:.18}
.mk-dot{width:8px;height:8px;border-radius:50%;background:#fff}
.mk svg{display:block}
.mk.hl{transform:scale(1.25);box-shadow:0 0 0 4px rgba(31,111,235,.35),0 2px 6px rgba(0,0,0,.4)}
.leaflet-tooltip{background:var(--panel);color:var(--text);border:1px solid var(--line);box-shadow:var(--shadow);font-size:12px;border-radius:7px;white-space:pre-line;text-align:center;width:max-content;max-width:300px}
.leaflet-tooltip-top:before{border-top-color:var(--panel)}
.leaflet-control-zoom a,.leaflet-bar a{background:var(--panel);color:var(--text);border-color:var(--line)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 80%,transparent)!important;color:var(--muted);font-size:9px}
.leaflet-control-attribution a{color:var(--muted)}
.mapbtns{position:absolute;top:12px;right:12px;z-index:500;display:flex;gap:6px}
.mapbtns button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;padding:7px 11px;font:inherit;font-size:12.5px;cursor:pointer;box-shadow:var(--shadow)}
.mapbtns #fullscreen{display:grid;place-items:center;width:36px;height:36px;padding:8px;border-color:#e4e8ef;border-radius:8px;background:#f8fafc;color:#64748b;box-shadow:0 1px 3px rgba(16,24,40,.08)}
.mapbtns #fullscreen:hover{background:#eef2f6;color:#334155}
#fullscreen svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#fullscreen .exit-icon{display:none}
#fullscreen[aria-pressed="true"] .expand-icon{display:none}
#fullscreen[aria-pressed="true"] .exit-icon{display:block}
#fullscreen:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.mapwrap{position:relative;min-height:0}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:minmax(260px,1fr) auto;height:100dvh}
  .mapwrap{order:-1}
  aside{border-right:0;border-top:1px solid var(--line)}
  .card{bottom:22px;padding:12px 14px 14px}
  .filters{flex:initial;padding:14px 16px;gap:14px}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="filters">
      <div class="filter-group"><div class="flabel">Turno</div>
      <div class="seg" id="fTurno"></div></div>
      <div class="filter-group"><div class="flabel">Día</div>
      <div class="chips days" id="fDia"></div></div>
      <div class="filter-group"><div class="flabel">Tipo de tarea</div>
      <div class="chips" id="fTipo"></div></div>
      <div class="filter-group"><div class="flabel">Municipio</div>
      <div class="chips" id="fMun"></div></div>
    </div>
  </aside>
  <div class="mapwrap">
    <div id="map"></div>
    <div class="card" id="card" hidden><button class="x" id="cardX" aria-label="Cerrar">×</button><div id="cardBody"></div></div>
    <div class="mapbtns"><button id="fullscreen" type="button" aria-label="Ver mapa y filtros en pantalla completa" aria-pressed="false"><svg class="expand-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M8 21H3v-5"/></svg><svg class="exit-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h5V3M21 8h-5V3M16 21v-5h5M8 21v-5H3"/></svg></button></div>
  </div>
</div>

// inicio: punto blanco al centro; fin: banderita
const START = '<span class="mk-dot"></span>';
const END = '<svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M3.5 1.5v13" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><path d="M4.5 2.2h8.2l-2 3.1 2 3.1H4.5z" fill="#fff"/></svg>';
function markerText(l, idx, t){
  const lb = l.label.toUpperCase();
  if (/^INICIO/.test(lb)) return START;
  if (/^FIN/.test(lb)) return t.tipo === "AVENIDAS" || t.tipo === "PAPELERAS" ? START : END;
  if (/^PUNTO MEDIO/.test(lb)) return "◎";
  const n = lb.match(/^(?:PUNTO\s*)?(\d+)/);
  if (n) return n[1];
  return t.links.filter(x => x.pt).length > 1 ? String(idx + 1) : "";
}

TASKS.forEach(t => {
  const c = color(t), layers = [], markers = [], pts = [];
  let k = 0;
  const marker = (pt, html) => {
    const icon = L.divIcon({ className: "", iconSize: [24, 24], iconAnchor: [12, 12], html: `<div class="mk" style="background:${c}">${html}</div>` });
    const m = L.marker(pt, { icon, riseOnHover: true })
      .bindTooltip(`<b>${esc(t.tarea)}</b>`, { direction: "top", offset: [0, -10] })
      .on("click", () => select(t.id));
    markers.push(m); layers.push(m); pts.push(pt);
    return m;
  };
  // con polígono (plaza/parque) o papeleras marcadas, los puntos del mensaje sobran;
  // en las zonas de barrio el "punto medio" también (queda solo el polígono)
  const sinPuntos = t.areas.length || t.papeleras.length;
  t.links.forEach(l => {
    if (l.path && l.path.length){
      if (!t.routes.length) layers.push(L.polyline(l.path, { color: c, weight: 3, opacity: .7, bubblingMouseEvents: false }));
      l.path.forEach(p => pts.push(p));
    } else if (l.pt && (sinPuntos || (t.zonas.length && /^punto medio/i.test(l.label)))){
      if (!t.papeleras.length) pts.push(l.pt);
    } else if (l.pt){
      const txt = markerText(l, k++, t);
      l.marker = marker(l.pt, txt === START || txt === END ? txt : esc(txt));
    }
  });
  // papeleras marcadas a mano (ajustes.json), numeradas; en parques se unen con una línea
  if (t.unir) layers.push(L.polyline(t.papeleras, { color: c, weight: 3, opacity: .85, lineJoin: "round", bubblingMouseEvents: false }));
  t.papeleras.forEach((p, i) => marker(p, String(i + 1)));
  // contorno de la plaza / parque / planta
  t.areas.forEach(rings => {
    layers.unshift(L.polygon(rings, { color: c, weight: 2, opacity: .85, fillOpacity: .15, bubblingMouseEvents: false }));
    rings.flat().forEach(p => pts.push(p));
  });
  const ini = t.links.find(l => l.pt && /^inicio/i.test(l.label)), fin = t.links.find(l => l.pt && /^fin/i.test(l.label));
  // recorridos por calle (calculados en build.py); si no hay, línea recta punteada de inicio a fin
  if (t.routes.length) t.routes.forEach(g => {
    layers.unshift(L.polyline(g, { color: c, weight: 4, opacity: .85, lineJoin: "round", bubblingMouseEvents: false }));
    g.forEach(p => pts.push(p));
  });
  else if (ini && fin) layers.unshift(L.polyline([ini.pt, fin.pt], { color: c, weight: 3, opacity: .7, dashArray: "6 6", bubblingMouseEvents: false }));
  // zonas de barrio del My Maps, debajo de todo lo demás
  (t.zonas || []).forEach(z => {
    layers.unshift(L.polygon(z.coords, { color: c, weight: 2, opacity: .85, fillOpacity: .15, bubblingMouseEvents: false }));
    z.coords.forEach(p => pts.push(p));
  });
  layers.filter(x => x instanceof L.Polyline).forEach(p => p
    .bindTooltip(`<b>${esc(t.tarea)}</b>`, { sticky: true, direction: "top", offset: [0, -8] })
    .on("click", () => select(t.id)));
  t.layer = L.layerGroup(layers);
  t.markers = markers; t.pts = pts;
});

/* ---------- filtros UI ---------- */
const $ = id => document.getElementById(id);
function chips(el, items, set, render){
  el.innerHTML = "";
  items.forEach(it => {
    const b = document.createElement("button");
    b.className = "chip" + (it.cls ? " " + it.cls : "");
    b.innerHTML = it.html; b.title = it.title || "";
    b.onclick = () => { set.has(it.v) ? set.delete(it.v) : set.add(it.v); refresh(); };
    b.dataset.v = it.v;
    el.appendChild(b);
  });
}
["TODOS","MATUTINO","VESPERTINO"].forEach(v => {
  const b = document.createElement("button");
  b.textContent = v === "TODOS" ? "Todos" : cap(v); b.dataset.v = v;
  b.onclick = () => { S.turno = v; refresh(); };
  $("fTurno").appendChild(b);
});
["TODOS", ...DIAS].forEach(d => {
  const b = document.createElement("button");
  b.className = "chip"; b.textContent = cap(d); b.dataset.v = d;
  b.onclick = () => { S.dia = d; refresh(); };
  $("fDia").appendChild(b);
});
const tipos = [...new Set(TASKS.map(t => t.tipo))].sort();
chips($("fTipo"), tipos.map(tp => ({ v: tp, html: `<span class="dot" style="background:${COLORS[tp]}"></span>${cap(tp)}` })), S.tipos);
const allMun = [...new Set(TASKS.flatMap(muns))].sort((a, b) => a.localeCompare(b, "es"));
chips($("fMun"), allMun.map(m => ({ v: m, html: m })), S.mun);

/* ---------- render ---------- */
function refresh(){
  document.querySelectorAll("#fTurno button").forEach(b => b.classList.toggle("on", b.dataset.v === S.turno));
  document.querySelectorAll("#fDia .chip").forEach(b => b.classList.toggle("on", b.dataset.v === S.dia));
  document.querySelectorAll("#fTipo .chip").forEach(b => b.classList.toggle("on", S.tipos.has(b.dataset.v)));
  document.querySelectorAll("#fMun .chip").forEach(b => b.classList.toggle("on", S.mun.has(b.dataset.v)));
  const vis = TASKS.filter(visible);
  TASKS.forEach(t => vis.includes(t) ? t.layer.addTo(map) : map.removeLayer(t.layer));
  if (S.sel !== null && !vis.includes(TASKS[S.sel])) closeDetail();
  highlight();
}



function highlight(){
  TASKS.forEach(t => t.markers.forEach(m => {
    const el = m.getElement()?.firstChild; if (!el) return;
    el.classList.toggle("dim", S.sel !== null && S.sel !== t.id);
  }));
  TASKS.forEach(t => t.layer.eachLayer(l => {
    const dim = S.sel !== null && S.sel !== t.id;
    if (l instanceof L.Polygon) l.setStyle({ opacity: dim ? .12 : .85, fillOpacity: dim ? .03 : S.sel === t.id ? .25 : .15 });
    else if (l instanceof L.Polyline) l.setStyle({ opacity: dim ? .12 : .85 });
  }));
}


// notas: días con una tarea distinta, p.ej. { "SÁBADO": "reciclables" } → "Sábado (reciclables)"
const diasTxt = (d, notas = {}) => d.length === 7 && !Object.keys(notas).length ? "Todos los días"
  : d.map(x => cap(x) + (notas[x] ? ` (${esc(notas[x])})` : "")).join(", ");
function select(id){
  const t = TASKS[id];
  const igual = t.turnos.every(x => diasTxt(x.dias) === diasTxt(t.turnos[0].dias));
  $("cardBody").innerHTML = `
    <div class="dtitle">${esc(t.tarea)}</div>
    <dl class="meta">
      <dt>Municipio</dt><dd>${esc(t.municipio)}</dd>
      <dt>Turno</dt><dd>${t.turnos.map(x => cap(x.turno)).join(" y ")}</dd>
      <dt>Días</dt><dd>${igual ? diasTxt(t.dias, t.dias_nota) : t.turnos.map(x => `${cap(x.turno)}: ${diasTxt(x.dias, t.dias_nota)}`).join("\n")}</dd>
      <dt>Tipo de tarea</dt><dd>${esc(cap(t.tipo))}</dd>
    </dl>`;
  $("card").hidden = false;
  S.sel = id;
  TASKS.forEach(x => x.markers.forEach(m => m.setZIndexOffset(x.id === id ? 1000 : 0)));
  highlight();
  // centrar la tarea en la parte del mapa que no tapa la tarjeta
  const pad = 40;
  if (t.pts.length) map.fitBounds(t.pts, {
    paddingTopLeft: [pad, pad + 40],
    paddingBottomRight: [pad, $("card").offsetHeight + 28 + pad],
    maxZoom: Math.max(map.getZoom(), 17)
  });
}
function closeDetail(){
  $("card").hidden = true;
  S.sel = null;
  highlight();
}
$("cardX").onclick = closeDetail;
map.on("click", closeDetail);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDetail(); });

function fitAll(){
  const pts = TASKS.filter(visible).flatMap(t => t.pts);
  if (pts.length) map.fitBounds(pts, { padding: [40, 40] });
}
$("fullscreen").onclick = async () => {
  try{
    if(document.fullscreenElement)await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  }catch(error){console.error("No se pudo cambiar a pantalla completa:",error)}
};
document.addEventListener("fullscreenchange",()=>{
  const active=Boolean(document.fullscreenElement);
  $("fullscreen").setAttribute("aria-pressed",String(active));
  $("fullscreen").setAttribute("aria-label",active?"Salir de pantalla completa":"Ver mapa y filtros en pantalla completa");
  map.invalidateSize();
});
map.on("zoomend moveend", highlight);
new ResizeObserver(() => map.invalidateSize()).observe(document.getElementById("map"));

refresh();
fitAll();
</script>
</body>
